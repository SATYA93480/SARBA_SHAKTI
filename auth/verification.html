<!-- Back To Top Fallback -->
<script>
(function () {
    var backTop = document.getElementById("back-top");
    if (!backTop) {
        return;
    }

    backTop.classList.add("rn-backto-top-active");

    var progressPath = backTop.querySelector("path");
    var pathLength =
        progressPath && typeof progressPath.getTotalLength === "function"
            ? progressPath.getTotalLength()
            : null;

    if (pathLength) {
        progressPath.style.transition = "none";
        progressPath.style.strokeDasharray = pathLength + " " + pathLength;
        progressPath.style.strokeDashoffset = pathLength;
        progressPath.getBoundingClientRect();
        progressPath.style.transition = "stroke-dashoffset 10ms linear";
    }

    var updateProgress = function () {
        if (!pathLength) {
            return;
        }
        var scroll = window.pageYOffset || document.documentElement.scrollTop || 0;
        var height =
            Math.max(
                document.documentElement.scrollHeight,
                document.body.scrollHeight
            ) - window.innerHeight;
        var progress = height > 0 ? pathLength - (scroll * pathLength) / height : pathLength;
        progressPath.style.strokeDashoffset = progress;
    };

    updateProgress();
    window.addEventListener("scroll", updateProgress);

    backTop.addEventListener("click", function (event) {
        event.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
})();
</script>
